    <rect x="26" y="16" width="8" height="8" rx="2"/>
    <rect x="38" y="16" width="8" height="8" rx="2"/>
    <rect x="14" y="28" width="8" height="8" rx="2"/>
    <rect x="26" y="28" width="8" height="8" rx="2"/>
    <rect x="38" y="28" width="8" height="8" rx="2"/>
    <rect x="14" y="40" width="32" height="8" rx="2"/>
  </g>
  <!-- S letter -->
  <text x="32" y="42" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="rgba(0,0,0,0.7)" text-anchor="middle">S</text>
</svg>
